<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60" fill="none">
  <!-- Horizon line -->
  <line x1="10" y1="46" x2="90" y2="46" stroke="#b88e44" stroke-width="2" stroke-linecap="round"/>
  <!-- Rising Sun semicircle -->
  <path d="M 32 46 A 18 18 0 0 1 68 46 Z" fill="#e08a2c" stroke="#8c6a28" stroke-width="1.5"/>
  <!-- Inner sun core detail -->
  <path d="M 38 46 A 12 12 0 0 1 62 46 Z" fill="#f5ab35"/>
  <!-- 3 Golden Rays -->
  <!-- Center ray -->
  <line x1="50" y1="24" x2="50" y2="10" stroke="#b88e44" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left ray -->
  <line x1="37" y1="28" x2="26" y2="16" stroke="#b88e44" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right ray -->
  <line x1="63" y1="28" x2="74" y2="16" stroke="#b88e44" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tiny accent stars/sparks -->
  <circle cx="50" cy="6" r="1.5" fill="#b88e44"/>
</svg>